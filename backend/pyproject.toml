[project]
name = "a-share-agent-backend"
version = "0.1.0"
description = "A-Share AI Agent Trading Simulation Backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "langgraph>=0.2.56",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langchain-core>=0.3.0",
    "langchain-deepseek>=0.1.0",
    "langchain-openai>=0.2.11",
    "tiktoken>=0.7.0",
    "langfuse>=3.0.0",
    "akshare>=1.14.0",
    "mini-racer>=0.12.0; sys_platform != 'linux'",
    "py-mini-racer>=0.6.0; sys_platform == 'linux'",
    "pandas>=2.1.0",
    "polars>=1.20.0",
    "numpy>=1.24.0",
    "matplotlib>=3.9.0",
    "mplfinance>=0.12.10b0",
    "xlsxwriter>=3.2.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "pyyaml>=6.0.0",
    "ddgs>=9.14.4,<10",
    "boto3>=1.35.0",
    "loguru>=0.7.0",
    "langsmith>=0.1.0",
    "tortoise-orm>=1.1.7",
    "psycopg[binary]>=3.2.0",
    "asyncpg>=0.30.0",
    "langchain>=1.3.16",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    # The application uses one event loop for its ORM lifecycle. Tests exercise
    # the same repositories from isolated pytest/asyncio.run loops, which is an
    # expected test-only pattern explicitly covered by Tortoise's warning.
    "ignore::tortoise.warnings.TortoiseLoopSwitchWarning",
]
